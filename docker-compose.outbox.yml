services:
  outbox-worker:
    image: whatsapp-platform-app:dev

    build:
      context: .
      dockerfile: Dockerfile

    container_name: whatsapp-platform-outbox-worker

    command:
      - python
      - -m
      - app.workers.outbox

    volumes:
      - ./app:/app/app

    environment:
      PYTHONUNBUFFERED: "1"

      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      RABBITMQ_URL: >-
        amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

    init: true