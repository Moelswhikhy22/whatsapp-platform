[project]
name = "whatsapp-platform"
version = "0.1.0"
description = "Multi-tenant WhatsApp communication management platform backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=10.1.0",
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142.2",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "myapplication>=0.1.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-aioboto3[s3]>=15.5.0",
    "types-hvac>=2.4.0.20260731",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

addopts = "-ra"

strict_config = true
strict_markers = true

markers = [
    "integration: tests that require external infrastructure",
]


[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",  # Formatter handles practical line wrapping.
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
[tool.mypy]
python_version = "3.12"
files = ["app"]

pretty = true
show_error_codes = true
show_column_numbers = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
