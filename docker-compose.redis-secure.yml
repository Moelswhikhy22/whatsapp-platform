services:
  api:
    environment:
      REDIS_URL: >-
        redis://whatsapp-platform:${REDIS_PASSWORD}@redis:6379/0

  worker:
    environment:
      REDIS_URL: >-
        redis://whatsapp-platform:${REDIS_PASSWORD}@redis:6379/0

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    entrypoint:
      - /bin/sh
      - /usr/local/bin/whatsapp-redis-start.sh

    volumes:
      - ./infra/redis/start.sh:/usr/local/bin/whatsapp-redis-start.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user whatsapp-platform --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
